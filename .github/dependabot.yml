version: 2

# Version and security updates target main only.
updates:
  - package-ecosystem: "npm"
    directory: "/WebApp"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      minor-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/WebApi"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      minor-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/WebApp"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/WebApi/WebApi"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
