version: 2

# Updates target main, where the full pipeline tests them. Safe minor/patch updates merge
# automatically after CI (dependabot-auto-merge.yml + after-ci.yml), and develop is then
# fast-forwarded to main, so both branches receive them without manual follow-up.
# Grouping keeps the number of PRs (and rebases under strict branch protection) low.
updates:
  - package-ecosystem: "npm"
    directory: "/WebApp"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/WebApi"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/WebApp"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/WebApi/WebApi"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-actions:
        update-types: ["minor", "patch"]
