name: Android APK

on:
  pull_request:
    branches: [develop, main]
    paths: ['AndroidApp/**', '.github/workflows/android.yml']
  push:
    branches: [develop, main]
    paths: ['AndroidApp/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.name }}
    defaults:
      run:
        working-directory: AndroidApp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Set version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "name=0.2.0.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Test, lint and compile optimized APKs
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assemblePreview :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nostalgia-android-preview
          path: AndroidApp/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release for isolated signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nostalgia-android-unsigned
          path: AndroidApp/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nostalgia-android-unsigned
          path: unsigned
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then echo "Missing signing secret: $variable"; exit 1; fi
          done
          sdkmanager 'build-tools;36.0.0' >/dev/null
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          trap 'rm -f "$RUNNER_TEMP/android-release.jks"' EXIT
          mkdir -p release
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/android-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "release/nostalgiatv-android-$VERSION.apk" unsigned/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 23 "release/nostalgiatv-android-$VERSION.apk"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish installable Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "android-v$VERSION" release/*.apk release/SHA256SUMS.txt \
            --target "$COMMIT" --title "NostalgiaTV Android $VERSION" --latest=false \
            --notes 'Universal Android 6.0+ APK for Android TV and mobile. Signed with the permanent release key. Tested and linted before publication.'
