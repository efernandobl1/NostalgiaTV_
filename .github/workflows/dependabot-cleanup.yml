name: Reconcile obsolete Dependabot updates

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: dependabot-cleanup
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always use trusted main code, never a dependency PR or a manually chosen ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Ask Dependabot to close updates already integrated in main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-cleanup.mjs
