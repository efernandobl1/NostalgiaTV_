name: Build and publish containers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-web

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish WebApi
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./WebApi
          file: ./WebApi/WebApi/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi
          provenance: mode=max
          sbom: true

      - name: Build and publish WebApp
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./WebApp
          file: ./WebApp/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp
          provenance: mode=max
          sbom: true

      - name: Attest WebApi image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest WebApp image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
