name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-web

# Keep production builds/deploys serialized; isolate each PR from that queue.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nostalgiatv-pr-{0}', github.event.pull_request.number) || 'nostalgiatv-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BASE" "$HEAD" | awk '
              /^(AndroidApp\/|\.github\/workflows\/android\.yml$)/ { next }
              { found=1 }
              END { print found ? "true" : "false" }')
            echo "web=$changed" >> "$GITHUB_OUTPUT"
          fi
  # Escaneo de seguridad como gate: si hay CVEs HIGH/CRITICAL, no se publica nada.
  security-scan:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Express
          # Ephemeral test credentials; this database is destroyed with the runner.
          MSSQL_SA_PASSWORD: 'Isolated-CI-Sql-Test-Only!2026'
        ports:
          - '127.0.0.1:1433:1433'
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"
          --health-interval=10s --health-timeout=5s --health-retries=20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cachea la base de datos de vulnerabilidades de Trivy entre corridas.
      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.trivycache
          key: trivy-db-${{ runner.os }}

      - name: Scan filesystem for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-dirs: .trivycache

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Audit and test frontend dependencies
        working-directory: WebApp
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm exec ng test --watch=false
      - name: Test dependency cleanup safeguards
        run: node --test .github/scripts/dependabot-cleanup.test.mjs
      - name: Test installation and backup safeguards
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Check the production bundle with its security policy
        working-directory: WebApp
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec ng build --configuration production
          pnpm test:security-browser
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Run security and SQL integration tests
        env:
          NOSTALGIA_MEDIA_TEST_SQL: 'Server=localhost,1433;Database=master;User Id=sa;Password=Isolated-CI-Sql-Test-Only!2026;Encrypt=True;TrustServerCertificate=True'
          FFMPEG_BINARY_FOLDER: /usr/bin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          dotnet restore WebApi/Infrastructure.Tests -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror:NU1903,NU1904
          dotnet test WebApi/Infrastructure.Tests -c Release

      - name: Reject newly introduced vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Build both images in parallel; the API Docker build also runs its tests.
  build-and-push:
    needs: [changes, security-scan]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/${{ github.repository_owner }}/nostalgia-api
            context: ./WebApi
            file: ./WebApi/WebApi/Dockerfile
          - name: web
            image: ghcr.io/${{ github.repository_owner }}/nostalgia-web
            context: ./WebApp
            file: ./WebApp/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ${{ matrix.name }} for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Check the non-root web server after runtime updates
        if: matrix.name == 'web'
        env:
          SCANNED_IMAGE: ${{ matrix.image }}:${{ github.sha }}
        run: docker run --rm --add-host webapi:127.0.0.1 --entrypoint nginx "$SCANNED_IMAGE" -t
      - name: Scan final runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Exercise fresh installation and backup restore on Linux
        if: matrix.name == 'api'
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The API under test was built above. Use the previously released web solely as the loopback proxy.
            trap 'docker ps -a; docker logs --tail 60 nostalgiatv-local-https-1 2>&1 || true' ERR
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker pull "ghcr.io/$OWNER/nostalgia-web:$FIXTURE_SHA"
          docker tag "ghcr.io/$OWNER/nostalgia-web:$FIXTURE_SHA" "ghcr.io/$OWNER/nostalgia-web:$RELEASE_SHA"
          sudo python3 deploy/manage.py init /opt/nostalgiatv-smoke \
            --server-url https://127.0.0.1 --local-bind 127.0.0.1 --release "$RELEASE_SHA" --web-port 18090
          root=/opt/nostalgiatv-smoke/data/caddy/caddy/pki/authorities/local/root.crt
          sudo curl --fail --silent --show-error --cacert "$root" https://127.0.0.1/api/v1/server
          sudo python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('manage', 'deploy/manage.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          installation = module.Installation('/opt/nostalgiatv-smoke')
          installation.sql('CREATE TABLE NostalgiaTV.dbo.MaintenanceSmoke(Id int NOT NULL); INSERT INTO NostalgiaTV.dbo.MaintenanceSmoke VALUES(7);')
          Path('/opt/nostalgiatv-smoke/uploads/restore-probe.txt').write_text('media retained')
          backup = installation.backup()
          installation.docker('down')
          module.restore('/opt/nostalgiatv-restored', backup)
          restored = module.Installation('/opt/nostalgiatv-restored')
          restored.docker('up', '-d', '--wait', '--wait-timeout', '180')
          restored.health()
          assert restored.sql('SELECT Id FROM NostalgiaTV.dbo.MaintenanceSmoke;', capture=True).strip() == '7'
          assert Path('/opt/nostalgiatv-restored/uploads/restore-probe.txt').read_text() == 'media retained'
          restored.docker('down')
          PY
      - name: Publish scanned image with provenance and SBOM
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          # Caché de capas por imagen (scope) para no pisarse entre api/web.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Sign image provenance with the temporary GitHub OIDC identity
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify the published signature and workflow identity
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_IMAGE: oci://${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: >-
          gh attestation verify "$SIGNED_IMAGE" --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml"
          --source-ref refs/heads/main

  server-release:
    name: Publish self-host installation bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package verified server release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="nostalgiatv-server-${GITHUB_SHA}"
          mkdir -p "$bundle/WebApp/public/assets"
          cp docker-compose.production.yml .env.production.example "$bundle/"
          cp -R deploy "$bundle/deploy"
          cp WebApp/public/assets/env.js "$bundle/WebApp/public/assets/"
          tar -czf "$bundle.tar.gz" -C "$bundle" .
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
          tag="server-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Self-host server ${GITHUB_SHA:0:7}" \
              --notes "Verified API and web image tag: ${GITHUB_SHA}. Linux x86-64 with Docker Compose, Python 3.12+ and OpenSSL. Install only in a new directory using deploy/manage.py init; existing installations use backup/update. Backups include private configuration and media. Local HTTPS requires trusting the exported public CA on each client. Never distribute CA private keys."
          fi
          gh release upload "$tag" "$bundle.tar.gz" "$bundle.tar.gz.sha256" --clobber

  # Despliegue en la VPS por SSH: baja las imágenes nuevas y reinicia el stack.
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy NostalgiaTV
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          # La clave 'deploy' en la VPS usa un comando forzado (dispatcher) que lee
          # el proyecto desde SSH_ORIGINAL_COMMAND. Mandamos "nostalgiatv" para que
          # el servidor ejecute su script de despliegue. (Si en su lugar la clave
          # tuviera un comando fijo, este argumento es ignorado: sigue funcionando.)
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            nostalgiatv
