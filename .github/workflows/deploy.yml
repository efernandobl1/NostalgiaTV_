name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nostalgia-web

# Un solo deploy a producción a la vez; no cancela el que ya está corriendo.
concurrency:
  group: nostalgiatv-production
  cancel-in-progress: false

jobs:
  # Escaneo de seguridad como gate: si hay CVEs HIGH/CRITICAL, no se publica nada.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cachea la base de datos de vulnerabilidades de Trivy entre corridas.
      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.trivycache
          key: trivy-db-${{ runner.os }}

      - name: Scan filesystem for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # WebApp = toolchain de build de Angular (devDependencies). Sus paquetes
          # NO llegan a la imagen final (solo nginx + estáticos ya compilados),
          # así que sus CVEs son de build, no de runtime. El backend .NET sí se escanea.
          skip-dirs: WebApp

  # Construye ambas imágenes EN PARALELO (matriz) con caché de capas por imagen.
  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/${{ github.repository_owner }}/nostalgia-api
            context: ./WebApi
            file: ./WebApi/WebApi/Dockerfile
          - name: web
            image: ghcr.io/${{ github.repository_owner }}/nostalgia-web
            context: ./WebApp
            file: ./WebApp/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          # Caché de capas por imagen (scope) para no pisarse entre api/web.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Despliegue en la VPS por SSH: baja las imágenes nuevas y reinicia el stack.
  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy NostalgiaTV
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          # La clave 'deploy' en la VPS usa un comando forzado (dispatcher) que lee
          # el proyecto desde SSH_ORIGINAL_COMMAND. Mandamos "nostalgiatv" para que
          # el servidor ejecute su script de despliegue. (Si en su lugar la clave
          # tuviera un comando fijo, este argumento es ignorado: sigue funcionando.)
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            nostalgiatv
