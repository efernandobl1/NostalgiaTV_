# La webapp sirve la SPA en HTTP y hace reverse proxy a la API (que queda oculta).
# El TLS lo termina el nginx del host de la VPS, que enruta el dominio hacia este
# contenedor (publicado sólo en localhost). La SPA usa apiUrl:'' (mismo origen).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Propaga el esquema público (https del nginx del host) o usa el propio si se
# accede directo al contenedor.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # Puerto no privilegiado: nginx corre como usuario 'nginx' (non-root).
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2048m;   # subidas de video (bumpers) pueden ser grandes

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # env.js sin caché: permite cambiar la config del frontend sin rebuild.
    location = /assets/env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ^~ da prioridad a este prefijo por sobre las location regex (p. ej. el
    # bloque de assets \.(png|webp|...)$), evitando que intercepten /api, /hubs
    # y sobre todo /uploads (imágenes .webp/.png servidas por la API).
    location ^~ /api/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # SignalR (WebSocket) para el estado del canal en tiempo real.
    location ^~ /hubs/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Media (video/logos) servido por la API. Sin buffering para streaming + Range.
    # ^~ es OBLIGATORIO: sin él, el regex de assets (.png/.webp/...) intercepta
    # /uploads/**.webp y las imágenes dan 404.
    location ^~ /uploads/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|svg|png|jpe?g|webp|ico|gif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
