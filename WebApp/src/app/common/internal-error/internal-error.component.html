<main class="signal-page" aria-labelledby="error-title">
  <div class="signal-page__scanlines" aria-hidden="true"></div>
  <section class="signal-card signal-card--error">
    <span class="signal-card__code">ERROR 500</span>
    <div class="signal-card__screen" aria-hidden="true">
      <span class="material-symbols-outlined">signal_disconnected</span>
    </div>
    <h1 id="error-title">Interferencia en la señal</h1>
    <p>No pudimos completar la operación. Intenta nuevamente o vuelve al canal principal.</p>
    <div class="signal-card__actions">
      <button type="button" class="signal-button signal-button--secondary" (click)="retry()">Reintentar</button>
      <a routerLink="/" class="signal-button signal-button--primary">Volver al inicio</a>
    </div>
  </section>
</main>
