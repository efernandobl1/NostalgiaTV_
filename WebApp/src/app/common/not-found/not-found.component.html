<main class="signal-page" [class.signal-page--tv]="tvMode.enabled()">
  <header class="signal-header">
    <a class="signal-brand" routerLink="/" aria-label="NostalgiaTV, inicio">
      <span class="signal-brand__screen" aria-hidden="true">N</span>NostalgiaTV
    </a>
    <a class="signal-back" routerLink="/" aria-label="Volver a ver TV" title="Volver a ver TV">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span
      ><span>Volver a ver TV</span>
    </a>
  </header>
  <div class="signal-main">
    <section class="signal-card signal-card--error" aria-labelledby="not-found-title">
      <div class="signal-card__screen" aria-hidden="true">404</div>
      <div class="signal-card__message">
        <h1 id="not-found-title">Señal perdida.</h1>
        <p>No encontramos esta página. La programación sigue en la sala.</p>
        <div class="signal-card__actions">
          <a routerLink="/" class="signal-button signal-button--primary">Volver a ver TV</a>
          <a routerLink="/dashboard/login" class="signal-button signal-button--secondary"
            >Entrar al panel</a
          >
        </div>
      </div>
    </section>
  </div>
</main>
