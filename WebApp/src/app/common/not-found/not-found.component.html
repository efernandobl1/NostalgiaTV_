<main class="not-found">
  <section class="signal-card" aria-labelledby="signal-title">
    <div class="crt-screen">
      <span class="error-code">404</span>
      <h1 id="signal-title">SEÑAL PERDIDA</h1>
    </div>
    <p>Esta página no está en la programación. Vuelve al canal principal o busca una serie.</p>
    <div class="error-actions">
      <a mat-button routerLink="/">Volver al inicio</a>
      <a mat-button routerLink="/" [queryParams]="{ search: true }" class="secondary-action">Buscar serie</a>
    </div>
  </section>
</main>
