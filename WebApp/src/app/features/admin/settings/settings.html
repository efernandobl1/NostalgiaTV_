<app-page-header eyebrow="CH 10 · SISTEMA" title="Ajustes">
  <button class="btn btn-primary" type="button">Guardar cambios</button>
</app-page-header>

<div class="grid grid-cols-[repeat(auto-fit,_minmax(420px,_1fr))] gap-4 items-start">
  <section class="flex flex-col gap-3.5 p-5 bg-panel border border-line rounded-[10px]" aria-labelledby="gen">
    <h2 class="m-0 font-display text-[18px] font-semibold" id="gen">General</h2>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Zona horaria
      <select class="field field-select"><option>America/Guatemala (UTC−6)</option><option>America/Mexico_City</option><option>UTC</option></select>
    </label>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Rol para nuevos espectadores
      <select class="field field-select"><option>Espectador</option><option>Editor</option></select>
    </label>
    <label class="flex items-center justify-between gap-3 min-h-11 text-[14px]">Registro público habilitado
      <input class="check" type="checkbox" checked>
    </label>
  </section>

  <section class="flex flex-col gap-3.5 p-5 bg-panel border border-line rounded-[10px]" aria-labelledby="sch">
    <h2 class="m-0 font-display text-[18px] font-semibold" id="sch">Reglas de programación</h2>
    <label class="flex flex-col gap-2 text-[12px] text-muted">
      <span class="flex justify-between">Ventana sin repetir episodios <span class="font-mono text-fg">{{ hours() }} h</span></span>
      <input class="w-full accent-amber" type="range" min="0" max="72" [value]="hours()" (input)="hours.set(+$any($event.target).value)">
    </label>
    <div class="grid grid-cols-2 gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Especiales por día (0–50) <input class="field field-select" type="number" min="0" max="50" value="2"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Especiales por serie/día <input class="field field-select" type="number" min="0" value="1"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Películas por día (0–20) <input class="field field-select" type="number" min="0" max="20" value="1"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Películas por serie/día <input class="field field-select" type="number" min="0" value="1"></label>
    </div>
  </section>

  <section class="flex flex-col gap-1 p-5 bg-panel border border-line rounded-[10px]" aria-labelledby="sea">
    <h2 class="m-0 mb-2.5 font-display text-[18px] font-semibold" id="sea">Temporadas (Halloween / Navidad)</h2>
    @for (s of seasonal; track s.label) {
      <label class="flex items-center justify-between gap-3 min-h-13 border-t border-raised-2">
        <span class="flex flex-col gap-0.5">
          <span class="text-[14px]">{{ s.label }}</span>
          <span class="text-[12px] text-muted">{{ s.hint }}</span>
        </span>
        <input class="check" type="checkbox" [checked]="s.on">
      </label>
    }
  </section>

  <section class="flex flex-col gap-3.5 p-5 bg-panel border border-line rounded-[10px]" aria-labelledby="res">
    <h2 class="m-0 font-display text-[18px] font-semibold" id="res">Política de recursos de media</h2>
    <div class="grid grid-cols-2 gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Núcleos de día <input class="field field-select" type="number" min="1" value="4"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Núcleos de noche <input class="field field-select" type="number" min="1" value="12"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Inicio nocturno <input class="field field-select" type="time" value="23:00"></label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Fin nocturno <input class="field field-select" type="time" value="06:00"></label>
    </div>
    <label class="flex items-center justify-between gap-3 min-h-11 text-[14px]">Modo nocturno habilitado
      <input class="check" type="checkbox" checked>
    </label>
  </section>
</div>

<section class="flex flex-col gap-4 p-5 bg-panel border border-line rounded-[10px]" aria-labelledby="cat">
  <h2 class="m-0 font-display text-[18px] font-semibold" id="cat">Catálogos</h2>
  <div class="grid grid-cols-[repeat(auto-fit,_minmax(260px,_1fr))] gap-5">
    @for (c of catalogs(); track c.title; let i = $index) {
      <div class="flex flex-col gap-2.5">
        <span class="font-mono text-[11px] tracking-[0.1em] text-muted">{{ c.title }}</span>
        <div class="flex flex-wrap gap-1.5">
          @for (item of c.items; track item) {
            <span class="py-1.5 px-3 rounded-[14px] text-[13px] bg-raised-2 border border-line">{{ item }}</span>
          }
        </div>
        <label class="relative flex gap-2">
          <span class="sr-only">Agregar a {{ c.title }}</span>
          <input #box class="field field-select" type="text" [placeholder]="c.placeholder" (keydown.enter)="add(i, box)">
          <button class="btn btn-ghost px-3.5 text-[13px]" type="button" (click)="add(i, box)">Agregar</button>
        </label>
      </div>
    }
  </div>
</section>
