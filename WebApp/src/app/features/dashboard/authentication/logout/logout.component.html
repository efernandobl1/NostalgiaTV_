<main class="signal-page" aria-labelledby="logout-title">
  <div class="signal-page__scanlines" aria-hidden="true"></div>
  <section class="signal-card signal-card--success">
    <span class="signal-card__code">FIN DE TRANSMISIÓN</span>
    <div class="signal-card__screen" aria-hidden="true">
      <span class="material-symbols-outlined">power_settings_new</span>
    </div>
    <h1 id="logout-title">Sesión cerrada</h1>
    <p>Tu sesión terminó correctamente. Puedes volver a la programación o iniciar sesión otra vez.</p>
    <div class="signal-card__actions">
      <a routerLink="/" class="signal-button signal-button--secondary">Volver a ver TV</a>
      <a routerLink="/dashboard/login" class="signal-button signal-button--primary">Iniciar sesión</a>
    </div>
  </section>
</main>
