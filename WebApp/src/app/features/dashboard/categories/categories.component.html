<section class="catalog-page">
  <header class="catalog-toolbar">
    <div class="catalog-search"><span class="material-symbols-outlined">search</span><input type="search" placeholder="Buscar categorías…" aria-label="Buscar categorías"></div>
    <button type="button" class="admin-button admin-button--primary" (click)="openForm()"><span class="material-symbols-outlined">add</span>Nueva categoría</button>
  </header>
  <div class="category-grid">
    @for (category of dataSource.data; track category.id) {
      <article class="category-card">
        <div><strong>{{ category.name }}</strong><span>Categoría del catálogo</span></div>
        <div>
          <button type="button" (click)="openForm(category)" aria-label="Editar categoría"><mat-icon>edit</mat-icon></button>
          <button type="button" class="is-danger" (click)="delete(category.id)" aria-label="Eliminar categoría"><mat-icon>delete</mat-icon></button>
        </div>
      </article>
    } @empty {
      <div class="admin-empty"><span class="material-symbols-outlined">sell</span><strong>No hay categorías</strong></div>
    }
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
</section>
