<div
    [class.component-dark-theme]="themeService.isDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()">

    <app-dashboard-page-header title="Channels">
        <button mat-flat-button color="primary" (click)="openForm()">
            <mat-icon>add</mat-icon> New Channel
        </button>
    </app-dashboard-page-header>

    <mat-card class="daxa-card mb-25 border-radius bg-white border-none d-block">
        <mat-card-content>
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource" class="w-full table-fixed [&_.mat-column-id]:w-[60px] [&_.mat-column-name]:w-[150px] [&_.mat-column-logo]:w-[80px] [&_.mat-column-history]:w-[200px] [&_.mat-column-startDate]:w-[120px] [&_.mat-column-endDate]:w-[120px] [&_.mat-column-series]:w-[200px] [&_.mat-column-actions]:w-[100px]">

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>#</th>
                        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>
                        <td mat-cell *matCellDef="let c">{{ c.name }}</td>
                    </ng-container>

                    <ng-container matColumnDef="logo">
                        <th mat-header-cell *matHeaderCellDef>Logo</th>
                        <td mat-cell *matCellDef="let c">
                            @if (c.logoPath) {
                            <img [src]="apiUrl + c.logoPath" [alt]="c.name + ' logo'" loading="lazy" decoding="async" style="height:32px; border-radius:4px;">
                            } @else { <span>—</span> }
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="history">
                        <th mat-header-cell *matHeaderCellDef>History</th>
                        <td mat-cell *matCellDef="let c">
                            <span class="block w-full truncate text-xs text-[#888]" [title]="c.history ?? ''">{{ c.history ?? '—' }}</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="startDate">
                        <th mat-header-cell *matHeaderCellDef>Start Date</th>
                        <td mat-cell *matCellDef="let c">{{ c.startDate | date:'mediumDate' }}</td>
                    </ng-container>

                    <ng-container matColumnDef="endDate">
                        <th mat-header-cell *matHeaderCellDef>End Date</th>
                        <td mat-cell *matCellDef="let c">{{ c.endDate ? (c.endDate | date:'mediumDate') : '—' }}</td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td mat-cell *matCellDef="let c">
                            <button mat-icon-button (click)="openForm(c)"><mat-icon>edit</mat-icon></button>
                            <button mat-icon-button (click)="viewSchedule(c)" matTooltip="View Schedule"><mat-icon>schedule</mat-icon></button>
                            <button mat-icon-button (click)="refreshSchedule(c)" matTooltip="Refresh Schedule"><mat-icon>refresh</mat-icon></button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="6">No channels found.</td>
                    </tr>
                </table>
            </div>
            <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
