<section class="access-module">
  <header class="catalog-toolbar">
    <div></div>
    <button type="button" class="admin-button admin-button--primary" (click)="openForm()"><span class="material-symbols-outlined">add_moderator</span>Nuevo rol</button>
  </header>
  <div class="access-list">
    @for (role of dataSource.data; track role.id) {
      <article class="access-row">
        <span class="access-avatar"><span class="material-symbols-outlined">shield</span></span>
        <div><strong>{{ role.name }}</strong><span>{{ role.description || 'Sin descripción' }}</span></div>
        <div class="access-actions">
          <button type="button" (click)="openForm(role)" aria-label="Editar rol"><mat-icon>edit</mat-icon></button>
          <button type="button" class="is-danger" (click)="delete(role.id)" aria-label="Eliminar rol"><mat-icon>delete</mat-icon></button>
        </div>
      </article>
    } @empty {
      <div class="admin-empty"><span class="material-symbols-outlined">shield</span><strong>No hay roles</strong></div>
    }
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
</section>
