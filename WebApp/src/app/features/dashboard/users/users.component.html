<section class="access-module">
  <header class="catalog-toolbar">
    <div class="catalog-search"><span class="material-symbols-outlined">search</span><input type="search" placeholder="Buscar usuarios…" aria-label="Buscar usuarios"></div>
    <button type="button" class="admin-button admin-button--primary" (click)="openForm()"><span class="material-symbols-outlined">person_add</span>Nuevo usuario</button>
  </header>
  <div class="access-list">
    @for (user of dataSource.data; track user.id) {
      <article class="access-row">
        <span class="access-avatar">{{ user.username.slice(0, 2).toUpperCase() }}</span>
        <div><strong>{{ user.username }}</strong><span>{{ user.rol.name }}</span></div>
        <span class="access-badge">{{ user.rol.name }}</span>
        <div class="access-actions">
          <button type="button" (click)="openForm(user)" aria-label="Editar usuario"><mat-icon>edit</mat-icon></button>
          <button type="button" class="is-danger" (click)="delete(user.id)" aria-label="Eliminar usuario"><mat-icon>delete</mat-icon></button>
        </div>
      </article>
    } @empty {
      <div class="admin-empty"><span class="material-symbols-outlined">group</span><strong>No hay usuarios</strong></div>
    }
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
</section>
