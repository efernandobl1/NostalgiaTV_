# ─────────────────────────────────────────────────────────────────────────────
# Bloque para el NGINX DEL HOST de la VPS (el que ya sirve tus otros proyectos).
# Termina TLS para el dominio de NostalgiaTV y enruta todo hacia el contenedor
# webapp, publicado en 127.0.0.1:8090. La API y la BD quedan ocultas.
#
# Instalación en la VPS (nginx del sistema):
#   sudo cp deploy/nginx-host/nostalgiatv.conf /etc/nginx/sites-available/nostalgiatv.conf
#   sudo ln -s /etc/nginx/sites-available/nostalgiatv.conf /etc/nginx/sites-enabled/
#   # 1) Apuntá el DNS (registro A) del dominio a la IP de la VPS.
#   # 2) Cert de Let's Encrypt (deja este archivo tal cual y corré):
#   sudo certbot --nginx -d nostalgiatv.tudominio.com
#      (certbot completa las rutas ssl_certificate automáticamente)
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Necesario para el WebSocket de SignalR. Si tu nginx del host ya define un
# 'map $http_upgrade ...' en otro sitio (p.ej. para gestiones), borrá este bloque
# para no duplicarlo (los 'map' son globales del contexto http).
map $http_upgrade $ntv_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nostalgiatv.tudominio.com;   # <-- CAMBIÁ por tu dominio

    # Validación de Let's Encrypt y redirección del resto a HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nostalgiatv.tudominio.com;   # <-- CAMBIÁ por tu dominio

    # certbot rellena estas dos rutas al correr 'certbot --nginx'.
    ssl_certificate     /etc/letsencrypt/live/nostalgiatv.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostalgiatv.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Subidas de video (bumpers) pueden ser grandes.
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # el host termina TLS

        # WebSocket (SignalR) + streaming de video sin buffering.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ntv_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
