name: nostalgiatv

# ─────────────────────────────────────────────────────────────────────────────
# Compose de PRODUCCIÓN para la VPS. Se coloca en /opt/nostalgiatv/docker-compose.yml
# junto a su .env y a la carpeta ./monitoring del repo. No construye imágenes de la
# app: las descarga de GHCR y Watchtower las actualiza cuando el CI publica una nueva
# :latest (despliegue sin SSH). El monitoreo (Loki + Alloy + Grafana + Uptime Kuma)
# viene integrado: Alloy recolecta los logs de todos los contenedores y los manda a
# Loki, Grafana los visualiza y Uptime Kuma sondea los /health.
#
# Preparación (una sola vez) en la VPS:
#   docker login ghcr.io -u <usuario> --password-stdin   # token classic (read:packages)
#   cp -r ./monitoring /opt/nostalgiatv/monitoring        # configs de Loki/Alloy/Grafana
#   mkdir -p /opt/nostalgiatv/{data/sqlserver,logs/webapi,media,uploads,data/loki,data/grafana,data/uptime-kuma,data/alloy}
#   chown -R 10001:0     /opt/nostalgiatv/data/sqlserver              # contenedor mssql
#   chown -R 1654:1654   /opt/nostalgiatv/logs /opt/nostalgiatv/media /opt/nostalgiatv/uploads   # 'app' del contenedor .NET
#   chown -R 10001:10001 /opt/nostalgiatv/data/loki /opt/nostalgiatv/data/alloy
#   chown -R 472:472     /opt/nostalgiatv/data/grafana
#   cp env.js /opt/nostalgiatv/env.js                     # apiUrl:'' (mismo origen, no requiere IP)
#
# Nada se publica al exterior salvo la webapp en 127.0.0.1:${WEB_HTTP_PORT:-8090}.
# El nginx del HOST termina TLS y enruta tu dominio hacia ese puerto (ver
# deploy/nginx-host/nostalgiatv.conf). API, BD y monitoreo quedan ocultos.
#
# Desplegar:  cd /opt/nostalgiatv && docker compose pull && docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-log-options: &default-log-options
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: nostalgia-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      TZ: ${TIME_ZONE:-America/Guatemala}
    volumes:
      - ./data/sqlserver:/var/opt/mssql
    networks:
      - data-net
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  webapi:
    image: ${API_IMAGE:?Defina API_IMAGE}
    container_name: nostalgia-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TIME_ZONE:-America/Guatemala}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NostalgiaTV;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      # Mismo origen vía Nginx: CORS casi no interviene, pero se deja el origen público por seguridad.
      Cors__AllowedOrigins__0: ${APP_PUBLIC_URL:?Defina APP_PUBLIC_URL}
      Jwt__Key: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      # Issuer/Audience fijos (no dependen de la IP/dominio) para que funcione en cualquier host.
      Jwt__Issuer: ${JWT_ISSUER:-nostalgiatv}
      Jwt__Audience: ${JWT_ISSUER:-nostalgiatv}
      # Nginx es el único borde: la API confía en X-Forwarded-Proto/For.
      ReverseProxy__TrustForwardedHeaders: "true"
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
    # Sin 'ports': la API NO se publica al host, sólo es visible dentro de las redes docker.
    expose:
      - "8080"
    volumes:
      - ./logs/webapi:/app/Logs
      - ./media:/app/wwwroot/uploads/media
      - ./uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - web-net
      - data-net
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Sirve la SPA + reverse proxy a la API (oculta). Publica sólo en localhost:
  # el nginx del host termina TLS y enruta el dominio hacia aquí. No expone 80/443
  # al exterior, así no choca con otros proyectos ya publicados en la VPS.
  webapp:
    image: ${WEB_IMAGE:?Defina WEB_IMAGE}
    container_name: nostalgia-web
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE:-America/Guatemala}
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8090}:80"
    volumes:
      - ${ENV_JS_PATH:-./env.js}:/usr/share/nginx/html/assets/env.js:ro
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - web-net
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Despliegue continuo SIN SSH: sondea GHCR y actualiza sólo los servicios
  # etiquetados cuando el CI publica una nueva :latest. No abre puertos entrantes.
  watchtower:
    image: containrrr/watchtower
    container_name: nostalgia-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
      TZ: ${TIME_ZONE:-America/Guatemala}
    networks:
      - web-net
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options

  # ── Monitoreo ──────────────────────────────────────────────────────────────
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    container_name: nostalgia-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.5.1}
    container_name: nostalgia-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    container_name: nostalgia-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TZ: ${TIME_ZONE:-America/Guatemala}
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:1}
    container_name: nostalgia-uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE:-America/Guatemala}
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-log-options

networks:
  web-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
