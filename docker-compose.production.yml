name: nostalgiatv

# ─────────────────────────────────────────────────────────────────────────────
# Compose de PRODUCCIÓN para la VPS. Se coloca en /opt/nostalgiatv/docker-compose.yml
# junto a su .env. No construye imágenes: las descarga de GHCR. El despliegue es
# MANUAL (sin Watchtower, para no correr un contenedor con acceso a docker.sock):
# cuando el CI publique una nueva :latest, hacés 'docker compose pull && up -d'.
# El monitoreo (Loki/Alloy/Grafana/Uptime Kuma) corre APARTE en su propio stack;
# Connect only to NostalgiaTV's monitoring network to avoid cross-project DNS aliases.
#
# Preparación (una sola vez) en la VPS:
#   docker login ghcr.io -u <usuario> --password-stdin   # token classic (read:packages)
#   docker network create monitoring-nostalgia    # if it does not exist
#   mkdir -p /opt/nostalgiatv/{data/sqlserver,logs/webapi,media,uploads}
#   chown -R 10001:0     /opt/nostalgiatv/data/sqlserver              # contenedor mssql
#   chown -R 1654:1654   /opt/nostalgiatv/logs /opt/nostalgiatv/media /opt/nostalgiatv/uploads   # 'app' del contenedor .NET
#   cp env.js /opt/nostalgiatv/env.js                     # apiUrl:'' (mismo origen, no requiere IP)
#
# Nada se publica al exterior salvo la webapp en 127.0.0.1:${WEB_HTTP_PORT:-8090}.
# El nginx del HOST termina TLS y enruta tu dominio hacia ese puerto (ver
# deploy/nginx-host/nostalgiatv.conf). API y BD quedan ocultas.
#
# Desplegar:  cd /opt/nostalgiatv && docker compose pull && docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-log-options: &default-log-options
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  local-https:
    profiles: [local-https]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    user: "1654:1654"
    environment:
      LOCAL_HTTPS_HOST: ${LOCAL_HTTPS_HOST:-localhost}
    ports:
      - "${LOCAL_HTTPS_BIND_IP:-127.0.0.1}:${LOCAL_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/local-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks: [web-net]
    depends_on:
      webapp:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    logging: *default-log-options

  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04}
    container_name: nostalgia-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      TZ: ${TIME_ZONE:-America/Guatemala}
    volumes:
      - ./data/sqlserver:/var/opt/mssql
    networks:
      - data-net
    security_opt:
      - no-new-privileges:true
    # Límites de recursos (§3.17 del documento de seguridad). Ajustá según la VPS.
    mem_limit: 2g
    cpus: 2.0
    logging: *default-log-options
    healthcheck:
      # Local process probe only; application connections validate the pinned certificate.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -Nm -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  webapi:
    image: ${API_IMAGE:?Defina API_IMAGE}
    container_name: nostalgia-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TIME_ZONE:-America/Guatemala}
      ConnectionStrings__DefaultConnection: ${DB_APP_CONNECTION_STRING:?Configure the restricted SQL login and verified TLS}
      Database__ApplyMigrations: "false"
      # Mismo origen vía Nginx: CORS casi no interviene, pero se deja el origen público por seguridad.
      Cors__AllowedOrigins__0: ${APP_PUBLIC_URL:?Defina APP_PUBLIC_URL}
      Jwt__Key: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      # Issuer/Audience fijos (no dependen de la IP/dominio) para que funcione en cualquier host.
      Jwt__Issuer: ${JWT_ISSUER:-nostalgiatv}
      Jwt__Audience: ${JWT_AUDIENCE:-nostalgiatv}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # Only trust the webapp proxy on this project's private network.
      ReverseProxy__TrustForwardedHeaders: "true"
      ReverseProxy__ProxyHost: webapp
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
      CommunityCatalog__PublicUrl: ${COMMUNITY_CATALOG_URL:-}
      # Reglas de generación de programación (aleatoria). Configurables por .env.
      ChannelScheduling__NoRepeatWindowHours: ${SCHED_NO_REPEAT_HOURS:-24}
      ChannelScheduling__TimeZoneId: ${TIME_ZONE:-America/Guatemala}
      ChannelScheduling__MaxSpecialsPerSeriesPerDay: ${SCHED_MAX_SPECIALS_PER_SERIES:-2}
      ChannelScheduling__MaxSpecialsPerDay: ${SCHED_MAX_SPECIALS_PER_DAY:-5}
      ChannelScheduling__MaxMoviesPerSeriesPerDay: ${SCHED_MAX_MOVIES_PER_SERIES:-2}
      ChannelScheduling__MaxMoviesPerDay: ${SCHED_MAX_MOVIES_PER_DAY:-2}
    # Sin 'ports': la API NO se publica al host, sólo es visible dentro de las redes docker.
    expose:
      - "8080"
    volumes:
      - ./logs/webapi:/app/Logs
      - ./certificates/sqlserver:/run/sqlserver:ro
      - ./media:/app/wwwroot/uploads/media
      - ./uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web-net
      - data-net
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: ${API_CPUS:-4.0}
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  media-worker:
    image: ${API_IMAGE:?Defina API_IMAGE}
    container_name: nostalgia-media-worker
    command: ["--media-worker"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: ${TIME_ZONE:-America/Guatemala}
      ConnectionStrings__DefaultConnection: ${DB_APP_CONNECTION_STRING:?Configure the restricted SQL login and verified TLS}
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
      MediaProcessing__PollSeconds: ${MEDIA_POLL_SECONDS:-60}
      MediaProcessing__StableAgeSeconds: ${MEDIA_STABLE_SECONDS:-120}
    volumes:
      - ./uploads:/app/wwwroot/uploads
      - ./certificates/sqlserver:/run/sqlserver:ro
      - ./media:/app/wwwroot/uploads/media
      - ./logs/media-worker:/app/Logs
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - data-net
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # This is the hard ceiling. The worker limits itself to the dashboard day/night policy.
    cpus: ${MEDIA_WORKER_CPUS:-4.0}
    cpu_shares: 128
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-log-options

  migrate:
    image: ${API_IMAGE:?Defina API_IMAGE}
    command: ["--migrate"]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__MigrationConnection: ${DB_MIGRATION_CONNECTION_STRING:?Configure the separate database migration login}
      BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./certificates/sqlserver:/run/sqlserver:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - data-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging: *default-log-options

  # Sirve la SPA + reverse proxy a la API (oculta). Publica sólo en localhost:
  # el nginx del host termina TLS y enruta el dominio hacia aquí. No expone 80/443
  # al exterior, así no choca con otros proyectos ya publicados en la VPS.
  webapp:
    image: ${WEB_IMAGE:?Defina WEB_IMAGE}
    container_name: nostalgia-web
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE:-America/Guatemala}
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8090}:8080"
    volumes:
      - type: bind
        source: ${ENV_JS_PATH:-./env.js}
        target: /usr/share/nginx/html/assets/env.js
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - web-net
      - monitoring
    # El contenedor web corre nginx como usuario 'nginx' (non-root) en el puerto
    # no privilegiado 8080: no necesita NINGUNA capability de root.
    user: nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  web-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  # Keep this external network separate from other projects' monitoring networks.
  # Attach Kuma/Alloy to it when monitoring this installation.
  monitoring:
    external: true
    name: ${MONITORING_NETWORK_NAME:-monitoring-nostalgia}
