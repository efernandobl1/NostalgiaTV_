name: nostalgia-tv

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -No >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  webapi:
    image: nostalgia-api:local
    build:
      context: ./WebApi
      dockerfile: WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NostalgiaTV;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost:8082}
      Jwt__Key: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8081}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:8081}
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
    ports:
      - 127.0.0.1:${API_HTTP_PORT:-8081}:8080
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  webapp:
    image: nostalgia-web:local
    build:
      context: ./WebApp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8081}
    ports:
      - 127.0.0.1:${WEB_HTTP_PORT:-8082}:8080
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  sqlserver_data:

networks:
  web:
    driver: bridge
  data:
    driver: bridge
    internal: true
