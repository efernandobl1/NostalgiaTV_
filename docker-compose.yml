name: nostalgiatv

# Compose para desarrollo/local: construye las imágenes desde el código y publica
# los puertos sólo en localhost. Para producción usa docker-compose.production.yml.

x-log-options: &default-log-options
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nostalgia-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nostalgia-net
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  webapi:
    build:
      context: ./WebApi
      dockerfile: WebApi/Dockerfile
    container_name: nostalgia-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TIME_ZONE:-America/Guatemala}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NostalgiaTV;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Cors__AllowedOrigins__0: http://localhost:${WEB_HTTP_PORT:-8082}
      Jwt__Key: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-nostalgiatv}
      Jwt__Audience: ${JWT_ISSUER:-nostalgiatv}
      # Permite acceder por nginx (mismo origen) sin bucles de redirect; en dev el
      # puerto sigue publicado para llegar directo a Scalar/OpenAPI en :8080.
      ReverseProxy__TrustForwardedHeaders: "true"
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
      # Reglas de generación de programación (aleatoria). Configurables por .env.
      ChannelScheduling__NoRepeatWindowHours: ${SCHED_NO_REPEAT_HOURS:-24}
      ChannelScheduling__MaxSpecialsPerSeriesPerDay: ${SCHED_MAX_SPECIALS_PER_SERIES:-2}
      ChannelScheduling__MaxSpecialsPerDay: ${SCHED_MAX_SPECIALS_PER_DAY:-5}
      ChannelScheduling__MaxMoviesPerSeriesPerDay: ${SCHED_MAX_MOVIES_PER_SERIES:-2}
      ChannelScheduling__MaxMoviesPerDay: ${SCHED_MAX_MOVIES_PER_DAY:-2}
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8080}:8080"
    volumes:
      - webapi_logs:/app/Logs
      - media_files:/app/wwwroot/uploads/media
      - uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - nostalgia-net
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  webapp:
    build:
      context: ./WebApp
      dockerfile: Dockerfile
    container_name: nostalgia-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8082}:8080"
    volumes:
      - ${ENV_JS_PATH:-./WebApp/public/assets/env.js}:/usr/share/nginx/html/assets/env.js:ro
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - nostalgia-net
    # nginx corre como usuario 'nginx' (non-root) en el puerto 8080.
    user: nginx
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sqlserver_data:
  webapi_logs:
  media_files:
  uploads:

networks:
  nostalgia-net:
    driver: bridge
