name: nostalgiatv

# Compose para desarrollo/local: construye las imágenes desde el código y publica
# los puertos sólo en localhost. Para producción usa docker-compose.production.yml.

x-log-options: &default-log-options
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04}
    container_name: nostalgia-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nostalgia-net
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -Q \"SELECT 1\" -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  webapi:
    build:
      context: ./WebApi
      dockerfile: WebApi/Dockerfile
    container_name: nostalgia-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TIME_ZONE:-America/Guatemala}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NostalgiaTV;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Cors__AllowedOrigins__0: http://localhost:${WEB_HTTP_PORT:-8082}
      Jwt__Key: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-nostalgiatv}
      Jwt__Audience: ${JWT_AUDIENCE:-nostalgiatv}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Metadata__Tmdb__ApiKey: ${TMDB_API_KEY:-}
      # Needed only on the first start, while "admin" still has the seed placeholder; the API stops with a clear error otherwise.
      BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Permite acceder por nginx (mismo origen) sin bucles de redirect; en dev el
      # puerto sigue publicado para llegar directo a Scalar/OpenAPI en :8080.
      ReverseProxy__TrustForwardedHeaders: "true"
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
      # Scheduling preferences are stored in SQL Server and edited in dashboard Settings.
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8080}:8080"
    volumes:
      - webapi_logs:/app/Logs
      - media_files:/app/wwwroot/uploads/media
      - uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - nostalgia-net
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  media-worker:
    build:
      context: ./WebApi
      dockerfile: WebApi/Dockerfile
    container_name: nostalgia-media-worker
    command: ["--media-worker"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      # FFmpeg shares this memory limit: cap the .NET heap at 384 MiB so the encoder keeps the rest.
      DOTNET_GCHeapHardLimit: "0x18000000"
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NostalgiaTV;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True
      FFmpeg__BinaryFolder: /usr/bin
      MediaSettings__BasePath: /app/wwwroot/uploads
      MediaProcessing__PollSeconds: ${MEDIA_POLL_SECONDS:-60}
      MediaProcessing__StableAgeSeconds: ${MEDIA_STABLE_SECONDS:-120}
    volumes:
      - uploads:/app/wwwroot/uploads
      - media_files:/app/wwwroot/uploads/media
      - media_worker_logs:/app/Logs
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - nostalgia-net
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${MEDIA_WORKER_CPUS:-4.0}
    cpu_shares: 128
    # 1080p x264 encoding plus HEVC decoding needs about 1 GiB; 768m got FFmpeg killed (exit 137) near the end.
    mem_limit: 1536m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-log-options

  webapp:
    build:
      context: ./WebApp
      dockerfile: Dockerfile
    container_name: nostalgia-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8082}:8080"
    volumes:
      - ${ENV_JS_PATH:-./WebApp/public/assets/env.js}:/usr/share/nginx/html/assets/env.js:ro
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - nostalgia-net
    # nginx corre como usuario 'nginx' (non-root) en el puerto 8080.
    user: nginx
    logging: *default-log-options
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sqlserver_data:
  webapi_logs:
  media_files:
  uploads:
  media_worker_logs:

networks:
  nostalgia-net:
    driver: bridge
