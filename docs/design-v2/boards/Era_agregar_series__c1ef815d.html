<!-- Diálogo · Series de la era -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-es-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">ÉPOCA DORADA 1996–2001</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-es-title">Series de la era</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" (click)="close()">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3 py-5 px-6">
    <label class="flex items-center gap-2 min-h-11 py-0 px-3 border border-edge rounded-md bg-ink">
      <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A29E91" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input class="flex-1 min-w-0 border-0 outline-none bg-transparent text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="search" aria-label="Buscar series" placeholder="Buscar series…">
    </label>
    <div class="flex flex-col max-h-105 overflow-y-auto border border-line rounded-lg">
      @for (r of rows; track $index) {
        <div class="flex flex-col gap-2 py-2.5 px-3 border-b border-raised-2">
          <label class="flex items-center gap-3 min-h-9 cursor-pointer">
            <input class="w-4.5 h-4.5 accent-amber" type="checkbox" [attr.checked]="r.on" [attr.sc-camel-on-change]="r.toggle">
            <span class="flex-1 text-[14px] font-medium">{{r.name}}</span>
            <span class="font-mono text-[11px] text-muted">{{r.years}}</span>
          </label>
          @if (r.on) {
            <div class="flex flex-wrap gap-1.5 pl-7.5" role="group" aria-label="Temporadas">
              @for (t of r.seasons; track $index) {
                <button type="button" (click)="t.toggle()" [attr.aria-pressed]="t.pressed">{{t.label}}</button>
              }
            </div>
          }
        </div>
      }
    </div>
    <span class="text-[12px] text-muted">Sin temporadas marcadas = se emiten todas.</span>
  </div>
  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    <span class="text-[13px] text-muted">{{count}} series seleccionadas</span>
    <span class="flex-1"></span>
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" (click)="close()">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" (click)="close()">Guardar</button>
  </footer>
</section>
