<!-- Diálogo · Era -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-era-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">CANAL 5 RETRO · ERA</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-era-title">{{heading}}</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" (click)="close()">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Nombre de la era
      <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="text" [attr.value]="name">
    </label>
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Inicio histórico
        <input class="min-h-11 py-0 px-2 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace] [color-scheme:dark]" type="date" value="1996-01-01">
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Fin histórico (opcional)
        <input class="min-h-11 py-0 px-2 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace] [color-scheme:dark]" type="date" value="2001-12-31">
      </label>
    </div>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Carpeta de interludios
      <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace]" type="text" value="/media/eras/epoca-dorada">
    </label>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Descripción
      <textarea class="py-2.5 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px/1.5_'IBM_Plex_Sans',_sans-serif] resize-y" rows="3">Auge del anime en la tarde y cortes de 2 a 4 anuncios.</textarea>
    </label>
    <fieldset class="m-0 p-0 border-0 flex flex-col gap-1.5">
      <legend class="pt-0 px-0 pb-1.5 text-[12px] text-muted">Reglas de corte</legend>
      <div class="grid grid-cols-[repeat(3,_minmax(0,_1fr))] gap-2.5">
        <label class="flex flex-col gap-1.5 text-[12px] text-muted">Mín. anuncios
          <input class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="number" min="1" value="2">
        </label>
        <label class="flex flex-col gap-1.5 text-[12px] text-muted">Máx. anuncios
          <input class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="number" min="1" value="4">
        </label>
        <label class="flex flex-col gap-1.5 text-[12px] text-muted">Máx. segundos
          <input class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="number" min="1" value="180">
        </label>
      </div>
    </fieldset>
  </div>
  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    <button class="min-h-11 py-0 px-3.5 border-0 rounded-md bg-transparent text-danger [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" (click)="close()">Eliminar era</button>
    <span class="flex-1"></span>
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" (click)="close()">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" (click)="close()">{{saveLabel}}</button>
  </footer>
</section>
