<!-- NostalgiaTV · Móvil · Iniciar sesión -->
<!-- CSS:
body{margin:0;background:#0E0E0C}
-->
<div class="w-97.5 h-211 overflow-y-auto pt-12 px-5 pb-6 flex flex-col gap-5 [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.025)_0_1px,_transparent_1px_3px),_#0E0E0C] text-fg font-sans">
  <div class="flex flex-col items-center gap-3 pt-3 px-0 pb-2">
    <svg width="56" height="56" sc-camel-view-box="0 0 36 36" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="30" height="22" rx="4"></rect><path d="M12 3l6 6 6-6"></path><rect x="8" y="14" width="16" height="12" rx="2"></rect></svg>
    <span class="font-display font-bold text-[22px] tracking-[0.08em]">NOSTALGIA TV</span>
    <span class="text-[14px] text-muted text-center">Tus clásicos, al aire otra vez.</span>
  </div>

  <h1 class="m-0 font-display font-bold text-[26px]">Iniciar sesión</h1>
  <label class="flex flex-col gap-1.5 text-[13px] text-muted">Usuario
    <input class="min-h-13 py-0 px-3.5 w-full border border-edge rounded-xl bg-panel text-fg [font:16px_'IBM_Plex_Sans',_sans-serif]" type="text" autocomplete="username" value="fernando">
  </label>
  <label class="flex flex-col gap-1.5 text-[13px] text-muted">Contraseña
    <input class="min-h-13 py-0 px-3.5 w-full border border-edge rounded-xl bg-panel text-fg [font:16px_'IBM_Plex_Sans',_sans-serif]" type="password" autocomplete="current-password" value="contraseña">
  </label>
  <div class="flex items-center justify-between gap-2">
    <label class="flex items-center gap-2 min-h-11 text-[14px]"><input class="w-5 h-5 accent-amber" type="checkbox" checked="">Mantener sesión</label>
    <a class="inline-flex items-center min-h-11 text-amber text-[14px] no-underline" routerLink="/recuperar">¿La olvidaste?</a>
  </div>
  <a class="flex items-center justify-center min-h-13 rounded-[26px] bg-amber text-on-amber font-semibold text-[16px] no-underline" routerLink="/MobHome">Ingresar</a>
  <div class="flex items-center gap-3 font-mono text-[11px] text-dim"><span class="flex-1 h-[1px] bg-line"></span>O<span class="flex-1 h-[1px] bg-line"></span></div>
  <button class="flex items-center justify-center gap-2.5 min-h-13 border border-edge rounded-[26px] bg-transparent text-fg [font:500_16px_'IBM_Plex_Sans',_sans-serif]" type="button">
    <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>
    Continuar con Google
  </button>
  <a class="flex items-center justify-center min-h-12 text-fg-2 text-[15px] no-underline" routerLink="/MobHome">Ver canales sin cuenta</a>
  <span class="mt-auto text-center text-[14px] text-muted">¿No tienes cuenta? <a class="text-amber" routerLink="/registro">Crear cuenta</a></span>
</div>
