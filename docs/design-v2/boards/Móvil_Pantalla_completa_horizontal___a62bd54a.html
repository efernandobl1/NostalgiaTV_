<!-- NostalgiaTV · Móvil · Pantalla completa -->
<!-- CSS:
body{margin:0;background:#000}
-->
<div class="relative w-211 h-97.5 overflow-hidden [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.04)_0_1px,_transparent_1px_3px),_radial-gradient(ellipse_at_center,_#2A2920_0%,_#050504_80%)] text-fg font-sans">
  <button class="absolute inset-0 border-0 bg-transparent cursor-pointer" type="button" (click)="toggle()" aria-label="Mostrar u ocultar controles"></button>
  <span class="absolute inset-0 flex items-center justify-center font-mono text-[12px] tracking-[0.14em] text-[#4E4C44] pointer-events-none" aria-hidden="true">[ VIDEO ]</span>
  <span class="absolute top-3 right-13 font-display font-bold text-ok [text-shadow:0_0_10px_rgba(139,224,143,0.5)] pointer-events-none" aria-hidden="true" [style.font-size]="numSize" [style.opacity]="numOpacity">{{ch.num}}</span>

  @if (show) {
    <div class="absolute left-0 right-0 top-0 pt-3 px-11 pb-10 flex items-center gap-2.5 [background:linear-gradient(180deg,_rgba(5,5,4,0.88),_rgba(5,5,4,0))]">
      <a class="w-11 h-11 flex items-center justify-center text-fg" routerLink="/MobPlayer" aria-label="Salir de pantalla completa">
        <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span class="flex flex-col gap-0.5">
        <span class="flex items-center gap-1.5 font-mono text-[11px] text-amber"><span class="py-[1px] px-[5px] rounded-[3px] text-on-live bg-live">EN VIVO</span>{{ch.name}}</span>
        <span class="font-semibold text-[16px]">{{ch.now}} · {{ch.code}}</span>
      </span>
      <span class="flex-1"></span>
      <button class="min-w-11 h-11 border-0 rounded-[22px] bg-[rgba(236,232,220,0.12)] text-fg [font:600_12px_'IBM_Plex_Mono',_monospace]" type="button" aria-label="Subtítulos">CC</button>
      <button class="w-11 h-11 flex items-center justify-center border-0 rounded-[22px] bg-[rgba(236,232,220,0.12)] text-fg" type="button" (click)="toggleLock()" aria-label="Bloquear controles">
        <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </button>
    </div>

    <div class="absolute top-[50%] left-[50%] [transform:translate(-50%,_-50%)] flex items-center gap-14">
      <button class="w-16 h-16 border-0 rounded-[32px] bg-[rgba(11,11,9,0.65)] text-fg [font:600_15px_'IBM_Plex_Mono',_monospace]" type="button" (click)="prev()" aria-label="Canal anterior">CH−</button>
      <a class="flex items-center justify-center h-13 py-0 px-5 rounded-[26px] bg-[rgba(11,11,9,0.65)] text-fg font-semibold text-[14px] no-underline" routerLink="/MobGuide">Guía</a>
      <button class="w-16 h-16 border-0 rounded-[32px] bg-[rgba(11,11,9,0.65)] text-fg [font:600_15px_'IBM_Plex_Mono',_monospace]" type="button" (click)="next()" aria-label="Canal siguiente">CH+</button>
    </div>

    <div class="absolute left-0 right-0 bottom-0 pt-10 px-11 pb-3.5 flex items-center gap-3 [background:linear-gradient(0deg,_rgba(5,5,4,0.9),_rgba(5,5,4,0))]">
      <button class="w-11 h-11 flex items-center justify-center border-0 bg-transparent text-fg" type="button" (click)="toggleMute()" [attr.aria-label]="muteLabel">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path [attr.d]="muteD"></path></svg>
      </button>
      <span class="font-mono text-[11px] text-muted">14:15</span>
      <span class="flex-1 h-1 rounded-xs bg-[rgba(255,255,255,0.18)]"><span class="block h-1 w-[34%] rounded-xs bg-amber"></span></span>
      <span class="font-mono text-[11px] text-muted">14:39</span>
      <span class="text-[12px] text-fg-2 whitespace-nowrap">Sigue: {{ch.next}}</span>
    </div>
  }

  @if (locked) {
    <button class="absolute left-[50%] bottom-5 [transform:translateX(-50%)] flex items-center gap-2 h-11 py-0 px-4.5 border-0 rounded-[22px] bg-[rgba(11,11,9,0.75)] text-fg [font:500_13px_'IBM_Plex_Sans',_sans-serif]" type="button" (click)="toggleLock()">Controles bloqueados · toca para desbloquear</button>
  }
</div>
