<!-- NostalgiaTV · Móvil · Series -->
<!-- CSS:
body{margin:0;background:#0E0E0C}
-->
<div class="w-97.5 h-211 flex flex-col overflow-hidden bg-ink text-fg font-sans">
  <header class="flex-none flex flex-col gap-3 pt-4 px-4 pb-3 border-b border-raised-2">
    <h1 class="m-0 font-display font-bold text-[26px]">Series</h1>
    <div class="flex gap-2">
      <label class="flex-1 flex items-center gap-2 min-h-11 py-0 px-3.5 border border-edge rounded-[22px] bg-panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A29E91" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input class="flex-1 min-w-0 border-0 outline-none bg-transparent text-fg [font:15px_'IBM_Plex_Sans',_sans-serif]" type="search" aria-label="Buscar series" [attr.value]="q" (change)="setQ($event)" placeholder="Buscar series…">
      </label>
      <button class="w-11 h-11 flex items-center justify-center border border-edge rounded-[22px] bg-transparent text-fg" type="button" (click)="toggleSort($event)" aria-label="Ordenar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
      </button>
    </div>
    <div class="flex gap-2 overflow-x-auto pb-0.5" role="group" aria-label="Filtros">
      @for (c of chips; track $index) {
        <button type="button" (click)="c.pick($event)" [attr.aria-pressed]="c.pressed" [style]="c.style">{{c.label}}</button>
      }
    </div>
    <span class="text-[12px] text-muted">{{count}} resultados · {{sortLabel}}</span>
  </header>

  <main class="flex-1 overflow-y-auto p-4">
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-3.5">
      @for (s of series; track $index) {
        <a class="flex flex-col gap-1.5 text-fg no-underline" routerLink="/MobSeries">
          <span class="relative flex items-end aspect-[2_/_3] p-2.5 rounded-xl overflow-hidden border border-line [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.04)_0_1px,_transparent_1px_3px),_#1F1F1B]">
            @if (s.onAir) {
              <span class="absolute top-2 left-2 py-0.5 px-1.5 rounded-[3px] font-mono text-[9px] tracking-[0.08em] text-on-live bg-live">AL AIRE</span>
            }
            <span class="font-display font-bold text-[16px] leading-[1.1]">{{s.name}}</span>
            <span class="absolute left-0 right-0 bottom-0 h-[3px] bg-[rgba(255,255,255,0.08)]"><span class="block h-[3px] bg-amber" [style.width.%]="s.pct"></span></span>
          </span>
          <span class="font-mono text-[11px] text-muted">{{s.years}} · ★ {{s.rating}}</span>
        </a>
      }
    </div>
    @if (none) {
      <div class="py-8 px-3 text-center text-muted text-[14px]">Ninguna serie coincide.</div>
    }
  </main>

  <nav class="flex-none flex border-t border-raised-2 bg-rail pb-2" aria-label="Principal">
    @for (t of nav; track $index) {
      <a [routerLink]="t.href" [attr.aria-current]="t.current" [style]="t.style">
        <span class="w-6 h-1 rounded-xs" aria-hidden="true" [style.background]="t.bar"></span>
        {{t.label}}
      </a>
    }
  </nav>
</div>
