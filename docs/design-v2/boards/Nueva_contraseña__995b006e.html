<!-- NostalgiaTV · Nueva contraseña -->
<!-- CSS:
body{margin:0;background:#0E0E0C}
a{color:#FFB547}a:hover{color:#FFD08A}
-->
<main class="min-h-screen py-12 px-6 flex flex-col items-center justify-center gap-7 [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.025)_0_1px,_transparent_1px_3px),_#0E0E0C] text-fg font-sans">
  <a class="flex items-center gap-2.5 text-fg no-underline" routerLink="/login">
    <svg width="32" height="32" viewBox="0 0 36 36" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="30" height="22" rx="4"></rect><path d="M12 3l6 6 6-6"></path><rect x="8" y="14" width="16" height="12" rx="2"></rect></svg>
    <span class="font-display font-bold text-[18px] tracking-[0.08em]">NOSTALGIA TV</span>
  </a>
  <form class="w-full max-w-110 flex flex-col gap-4.5 p-8 bg-panel border border-line rounded-xl">
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[11px] tracking-[0.14em] text-amber">PASO 2 DE 2</span>
      <h1 class="m-0 font-display font-bold text-[28px]">Crea una contraseña nueva</h1>
      <span class="text-[14px] text-muted">Al guardar se cerrarán tus sesiones en otros dispositivos.</span>
    </div>
    <label class="flex flex-col gap-1.5 text-[13px] text-muted">Nueva contraseña
      <input class="min-h-12 py-0 px-3.5 w-full border border-edge rounded-lg bg-ink text-fg [font:15px_'IBM_Plex_Sans',_sans-serif]" type="password" autocomplete="new-password" [attr.value]="pwd" (change)="setPwd($event)">
    </label>
    <ul class="m-0 p-0 list-none flex flex-col gap-1.5">
      @for (r of rules; track $index) {
        <li class="flex items-center gap-2 text-[13px]" [style.color]="r.color">
          <span class="font-mono" aria-hidden="true">{{r.mark}}</span>{{r.label}}
        </li>
      }
    </ul>
    <label class="flex flex-col gap-1.5 text-[13px] text-muted">Confirmar contraseña
      <input class="min-h-12 py-0 px-3.5 w-full border border-edge rounded-lg bg-ink text-fg [font:15px_'IBM_Plex_Sans',_sans-serif]" type="password" autocomplete="new-password">
    </label>
    <a class="flex items-center justify-center min-h-12 rounded-lg bg-amber text-on-amber font-semibold text-[15px] no-underline" routerLink="/login">Guardar contraseña</a>
  </form>
</main>
