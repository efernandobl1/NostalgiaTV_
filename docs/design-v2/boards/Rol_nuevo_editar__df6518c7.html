<!-- Diálogo · Rol -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-role-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">ACCESO · ROL</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-role-title">{{heading}}</h2>
    </div>
    <button class="btn-icon" type="button" aria-label="Cerrar" (click)="close($event)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Nombre
      <input class="field" type="text" [attr.value]="roleName">
    </label>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Descripción
      <textarea class="field field-area" rows="2">Catálogo, canales y programación</textarea>
    </label>
    <span class="text-[12px] text-muted">Los menús se asignan desde la pestaña Roles y menús.</span>
  </div>
  <footer class="flex flex-wrap justify-end gap-2.5 py-4 px-6 border-t border-line">
    <button class="btn btn-ghost" type="button" (click)="close($event)">Cancelar</button>
    <button class="btn btn-primary" type="button" (click)="close($event)">Guardar</button>
  </footer>
</section>
