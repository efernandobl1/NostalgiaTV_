<!-- Diálogo · Serie -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-series-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">CATÁLOGO · SERIE</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-series-title">{{heading}}</h2>
    </div>
    <button class="btn-icon" type="button" aria-label="Cerrar" (click)="close($event)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <div class="flex flex-col gap-3.5 py-5 px-6">
    <div class="flex gap-4 items-start">
      <label class="relative w-24 h-33 flex-none flex flex-col items-center justify-center gap-1 border border-dashed border-edge-2 rounded-lg cursor-pointer text-center text-[11px] text-muted [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.04)_0_1px,_transparent_1px_3px),_#1F1F1B]">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
        Cambiar logo
        <input class="absolute w-[1px] h-[1px] opacity-[0]" type="file" accept="image/*">
      </label>
      <div class="flex-1 min-w-0 flex flex-col gap-3.5">
        <label class="flex flex-col gap-1.5 text-[12px] text-muted">Nombre
          <input class="field" type="text" [attr.value]="name">
        </label>
        <div class="grid grid-cols-[repeat(3,_minmax(0,_1fr))] gap-2.5">
          <label class="flex flex-col gap-1.5 text-[12px] text-muted">Inicio
            <input class="field field-date" type="date" value="1989-04-26">
          </label>
          <label class="flex flex-col gap-1.5 text-[12px] text-muted">Fin (opcional)
            <input class="field field-date" type="date" value="1996-01-31">
          </label>
          <label class="flex flex-col gap-1.5 text-[12px] text-muted">Rating
            <input class="field field-mono" type="number" step="0.1" min="0" max="10" value="8.8">
          </label>
        </div>
      </div>
    </div>

    <fieldset class="m-0 p-0 border-0 flex flex-col gap-2">
      <legend class="pt-0 px-0 pb-2 text-[12px] text-muted">Categorías</legend>
      <div class="flex flex-wrap gap-1.5">
        @for (c of cats; track $index) {
          <button type="button" (click)="c.toggle($event)" [attr.aria-pressed]="c.pressed" [style]="c.style">{{c.name}}</button>
        }
      </div>
    </fieldset>

    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Carpeta de la serie
      <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace]" type="text" value="/media/series/dbz">
    </label>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Descripción
      <textarea class="field field-area" rows="3">Goku y sus amigos defienden la Tierra de enemigos cada vez más poderosos.</textarea>
    </label>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Historia (cómo llegó a la TV local)
      <textarea class="field field-area" rows="3">[Notas sobre su emisión original]</textarea>
    </label>
  </div>

  <footer class="flex flex-wrap justify-end gap-2.5 py-4 px-6 border-t border-line">
    <button class="btn btn-ghost" type="button" (click)="close($event)">Cancelar</button>
    <button class="btn btn-primary" type="button" (click)="close($event)">{{saveLabel}}</button>
  </footer>
</section>
