<!-- Diálogo · Canal -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-ch-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">CANALES</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-ch-title">{{heading}}</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" [attr.onClick]="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <div class="flex gap-4 items-start">
      <label class="relative w-24 h-24 flex-none flex flex-col items-center justify-center gap-1 border border-dashed border-edge-2 rounded-[10px] cursor-pointer text-[11px] text-muted text-center [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.04)_0_1px,_transparent_1px_3px),_#1F1F1B]">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
        Logo
        <input class="absolute w-[1px] h-[1px] opacity-[0]" type="file" accept="image/*">
      </label>
      <div class="flex-1 min-w-0 flex flex-col gap-3.5">
        <label class="flex flex-col gap-1.5 text-[12px] text-muted">Nombre del canal
          <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="text" [attr.value]="name">
        </label>
        <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
          <label class="flex flex-col gap-1.5 text-[12px] text-muted">Inicio
            <input class="min-h-11 py-0 px-2 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace] [color-scheme:dark]" type="date" value="2024-03-01">
          </label>
          <label class="flex flex-col gap-1.5 text-[12px] text-muted">Cierre (opcional)
            <input class="min-h-11 py-0 px-2 w-full border border-edge rounded-md bg-ink text-fg [font:13px_'IBM_Plex_Mono',_monospace] [color-scheme:dark]" type="date">
          </label>
        </div>
      </div>
    </div>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Historia del canal
      <textarea class="py-2.5 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px/1.5_'IBM_Plex_Sans',_sans-serif] resize-y" rows="4">Canal de caricaturas y anime de la televisión abierta, con bloques de tarde y cortes comerciales de época.</textarea>
    </label>
    <div class="flex items-center gap-2.5 py-2.5 px-3 rounded-md bg-raised">
      <span class="flex-1 min-w-0 font-mono text-[12px] text-muted truncate">Enlace público: /c/7f3c2e10-…-a91e</span>
      <button class="min-h-9 py-0 px-3 border border-edge rounded-md bg-transparent text-fg [font:500_13px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button">Regenerar</button>
    </div>
  </div>
  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    <button class="min-h-11 py-0 px-3.5 border-0 rounded-md bg-transparent text-danger [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Eliminar canal</button>
    <span class="flex-1"></span>
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">{{saveLabel}}</button>
  </footer>
</section>
