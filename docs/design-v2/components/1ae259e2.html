<!-- NostalgiaTV · Sidebar -->
<!-- CSS:
body{margin:0}
-->
<nav class="w-full min-h-240 py-6 px-3.5 flex flex-col gap-6.5 bg-rail text-fg font-sans" aria-label="Navegación del dashboard">
  <a class="flex items-center gap-3 py-0 px-2 no-underline text-fg" routerLink="/admin">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="9" width="30" height="22" rx="4"></rect>
      <path d="M12 3l6 6 6-6"></path>
      <rect x="8" y="14" width="16" height="12" rx="2"></rect>
      <circle cx="28" cy="16" r="1.2"></circle>
      <circle cx="28" cy="22" r="1.2"></circle>
    </svg>
    <span class="flex flex-col gap-0.5">
      <span class="font-display font-bold text-[18px] tracking-[0.08em]">NOSTALGIA TV</span>
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">CONTROL MASTER</span>
    </span>
  </a>

  @for (g of groups; track $index) {
    <div class="flex flex-col gap-0.5">
      <span class="pt-0 px-2.5 pb-1.5 font-mono text-[11px] tracking-[0.14em] text-dim">{{g.label}}</span>
      @for (it of g.items; track $index) {
        <a [routerLink]="it.href" [attr.aria-current]="it.current">
          <span class="w-7.5 font-mono text-[11px]" [style.color]="it.chColor">{{it.ch}}</span>
          <span class="flex-1">{{it.label}}</span>
          @if (it.hasBadge) {
            <span class="min-w-5.5 py-0.5 px-1.5 rounded-[10px] text-center font-mono text-[11px] text-on-amber bg-amber">{{it.badge}}</span>
          }
        </a>
      }
    </div>
  }

  <div class="mt-auto flex items-center gap-2.5 p-3 border border-line rounded-[10px] bg-panel">
    <span class="w-9 h-9 rounded-lg flex items-center justify-center font-display font-bold text-on-amber bg-amber" aria-hidden="true">AD</span>
    <span class="flex-1 flex flex-col gap-0.5 min-w-0">
      <span class="text-[14px] font-semibold">admin</span>
      <span class="text-[12px] text-muted">Administrador</span>
    </span>
    <a class="flex items-center justify-center w-11 h-11 text-muted" routerLink="/admin/acceso" aria-label="Cerrar sesión">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
    </a>
  </div>
</nav>
