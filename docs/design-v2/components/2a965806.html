<!-- Diálogo · Punto de corte -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-bp-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">T2 · E14 · EL PODER OCULTO DE GOHAN</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-bp-title">Punto de corte</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" [attr.onClick]="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <div class="relative h-18 rounded-md [background:repeating-linear-gradient(0deg,_rgba(255,255,255,0.035)_0_1px,_transparent_1px_3px),_#1F1F1B] flex items-end p-2" aria-hidden="true">
      <span class="font-mono text-[11px] text-muted">vista previa · 07:12.400</span>
      <span class="absolute left-[33%] top-0 bottom-0 w-0.5 bg-info"></span>
    </div>
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Posición (mm:ss.mmm)
        <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:15px_'IBM_Plex_Mono',_monospace]" type="text" value="07:12.400" inputmode="decimal">
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Etiqueta (opcional)
        <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="text" value="Corte A">
      </label>
    </div>
    <span class="text-[12px] text-muted">Debe ser mayor a 0 y distinto de los otros puntos del episodio.</span>
  </div>
  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    <button class="min-h-11 py-0 px-3.5 border-0 rounded-md bg-transparent text-danger [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Eliminar</button>
    <span class="flex-1"></span>
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Guardar</button>
  </footer>
</section>
