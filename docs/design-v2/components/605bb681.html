<!-- Diálogo · Importar metadatos -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-imp-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">DRAGON BALL Z</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-imp-title">Importar metadatos</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" [attr.onClick]="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Proveedor
        <select class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif] [color-scheme:dark]"><option>TMDB</option><option>TheTVDB</option></select>
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">ID externo
        <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="text" value="12971">
      </label>
    </div>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Idioma
      <select class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif] [color-scheme:dark]"><option>es-MX · Español (Latinoamérica)</option><option>es-ES · Español (España)</option><option>en-US · English</option></select>
    </label>
    <fieldset class="m-0 p-0 border-0 flex flex-col gap-0.5">
      <legend class="pt-0 px-0 pb-1.5 text-[12px] text-muted">Sobrescribir</legend>
      <label class="flex items-center gap-2.5 min-h-10 text-[14px]"><input class="w-4.5 h-4.5 accent-amber" type="checkbox" checked="">Descripción y rating</label>
      <label class="flex items-center gap-2.5 min-h-10 text-[14px]"><input class="w-4.5 h-4.5 accent-amber" type="checkbox" checked="">Títulos de episodios</label>
      <label class="flex items-center gap-2.5 min-h-10 text-[14px]"><input class="w-4.5 h-4.5 accent-amber" type="checkbox">Logo / póster</label>
    </fieldset>
    <div class="py-2.5 px-3 rounded-md bg-raised text-[12px] text-muted">Último intento: <span class="text-danger">fallido</span> · TheTVDB · 03 oct 09:14</div>
  </div>
  <footer class="flex flex-wrap justify-end gap-2.5 py-4 px-6 border-t border-line">
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Importar</button>
  </footer>
</section>
