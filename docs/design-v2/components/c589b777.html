<!-- Diálogo · Limpiar cola -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-cq-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">PROCESAMIENTO DE MEDIA</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-cq-title">Limpiar cola</h2>
    </div>
    <button class="btn-icon" type="button" aria-label="Cerrar" (click)="close($event)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-4 py-5 px-6">
    <fieldset class="m-0 p-0 border-0 flex flex-col gap-1.5">
      <legend class="pt-0 px-0 pb-2 text-[12px] text-muted">Qué jobs eliminar</legend>
      @for (s of statuses; track $index) {
        <label class="flex items-center gap-3 min-h-12 py-0 px-3 border border-line rounded-md cursor-pointer">
          <input class="check" type="checkbox" [attr.checked]="s.on" (change)="s.toggle($event)">
          <span class="flex-1 flex flex-col gap-0.5">
            <span class="text-[14px]">{{s.label}}</span>
            <span class="text-[12px] text-muted">{{s.hint}}</span>
          </span>
          <span class="font-mono text-[13px]" [style.color]="s.color">{{s.count}}</span>
        </label>
      }
      <span class="text-[12px] text-dim">Los jobs en procesamiento (3) no se pueden eliminar; deshabilita el worker primero.</span>
    </fieldset>

    <div class="grid grid-cols-[repeat(3,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Serie
        <select class="field field-select"><option>Todas</option><option>Dragon Ball Z</option><option>Pokémon</option><option>Los Simpson</option></select>
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Worker
        <select class="field field-select"><option>Todos</option><option>transcode</option><option>probe</option><option>thumbnails</option></select>
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Más antiguos que
        <select class="field field-select"><option>Cualquier fecha</option><option>1 día</option><option>7 días</option><option>30 días</option></select>
      </label>
    </div>

    <div class="flex flex-col gap-2.5 p-3.5 border border-[#5A3A33] rounded-lg bg-[#221715]">
      <span class="text-[14px]">Se eliminarán <strong class="font-mono text-danger">{{total}}</strong> jobs. Esta acción no se puede deshacer.</span>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Escribe LIMPIAR para confirmar
        <input class="field field-mono tracking-[0.1em]" type="text" [attr.value]="typed" (change)="setTyped($event)" autocomplete="off">
      </label>
    </div>
  </div>
  <footer class="flex flex-wrap justify-end gap-2.5 py-4 px-6 border-t border-line">
    <button class="btn btn-ghost" type="button" (click)="close($event)">Cancelar</button>
    <button type="button" (click)="close($event)" [attr.disabled]="locked" [style]="dangerStyle">Eliminar {{total}} jobs</button>
  </footer>
</section>
