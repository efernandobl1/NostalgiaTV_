<!-- Diálogo · Interludio de era -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-ei-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">ÉPOCA DORADA 1996–2001</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-ei-title">Asignar interludio</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" [attr.onClick]="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Interludio
      <select class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif] [color-scheme:dark]"><option>Ya viene · Canal 5 (1997) — Bumper</option><option>Continuamos con · Canal 5 — Bumper</option><option>Anuncio cereal (1998) — Anuncio</option></select>
    </label>
    <div class="flex flex-col gap-1.5" role="radiogroup" aria-label="Alcance">
      <span class="text-[12px] text-muted">Alcance</span>
      @for (s of scopes; track $index) {
        <label class="flex items-center gap-3 min-h-12 py-0 px-3 border border-line rounded-md cursor-pointer">
          <input class="w-4.5 h-4.5 accent-amber" type="radio" name="scope" [attr.checked]="s.on" [attr.onChange]="s.pick">
          <span class="flex flex-col gap-0.5">
            <span class="text-[14px]">{{s.label}}</span>
            <span class="text-[12px] text-muted">{{s.hint}}</span>
          </span>
        </label>
      }
    </div>
    @if (bySeries) {
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Serie de la era
        <select class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif] [color-scheme:dark]"><option>Dragon Ball Z</option><option>Hey Arnold!</option><option>Pokémon</option></select>
      </label>
    }
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Peso (probabilidad)
        <input class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="number" min="1" value="3">
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Separación mínima (seg)
        <input class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Mono',_monospace]" type="number" min="0" value="900">
      </label>
    </div>
  </div>
  <footer class="flex flex-wrap justify-end gap-2.5 py-4 px-6 border-t border-line">
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Asignar</button>
  </footer>
</section>
