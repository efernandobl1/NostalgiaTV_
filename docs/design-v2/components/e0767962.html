<!-- Diálogo · Usuario -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-user-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">ACCESO · USUARIO</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-user-title">{{heading}}</h2>
    </div>
    <button class="w-11 h-11 flex items-center justify-center border-0 rounded-md bg-transparent text-muted cursor-pointer" type="button" aria-label="Cerrar" [attr.onClick]="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>
  <div class="flex flex-col gap-3.5 py-5 px-6">
    <div class="grid grid-cols-[repeat(2,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Usuario
        <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="text" [attr.value]="username" autocomplete="off">
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Rol
        <select class="min-h-11 py-0 px-2.5 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif] [color-scheme:dark]"><option>Administrador</option><option selected="">Editor</option><option>Espectador</option></select>
      </label>
    </div>
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">{{pwdLabel}}
      <input class="min-h-11 py-0 px-3 w-full border border-edge rounded-md bg-ink text-fg [font:14px_'IBM_Plex_Sans',_sans-serif]" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    </label>
    @if (editing) {
      <div class="flex flex-col gap-2 p-3 rounded-lg bg-raised">
        <span class="font-mono text-[11px] tracking-[0.1em] text-muted">SEGURIDAD</span>
        <div class="flex flex-wrap items-center justify-between gap-2.5 text-[14px]">
          <span><span class="text-amber">3 intentos fallidos</span> · sin bloqueo activo</span>
          <button class="min-h-9 py-0 px-3 border border-edge rounded-md bg-transparent text-fg [font:500_13px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button">Reiniciar intentos</button>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2.5 text-[14px]">
          <span>2 sesiones activas · versión de sesión 7</span>
          <button class="min-h-9 py-0 px-3 border border-edge rounded-md bg-transparent text-danger [font:500_13px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button">Cerrar todas</button>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <span class="font-mono text-[11px] tracking-[0.1em] text-muted">INICIOS DE SESIÓN EXTERNOS</span>
        <div class="flex items-center gap-2.5 min-h-11 py-0 px-3 border border-line rounded-md text-[14px]">
          <span class="flex-1">Google · vinculado 12 sep 2026</span>
          <button class="min-h-9 py-0 px-3 border-0 rounded-md bg-transparent text-danger [font:500_13px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button">Desvincular</button>
        </div>
      </div>
    }
  </div>
  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    @if (editing) {
      <button class="min-h-11 py-0 px-3.5 border-0 rounded-md bg-transparent text-danger [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Desactivar usuario</button>
    }
    <span class="flex-1"></span>
    <button class="min-h-11 py-0 px-4 border border-edge rounded-md bg-transparent text-fg [font:500_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">Cancelar</button>
    <button class="min-h-11 py-0 px-4.5 border-0 rounded-md bg-amber text-on-amber [font:600_14px_'IBM_Plex_Sans',_sans-serif] cursor-pointer" type="button" [attr.onClick]="close">{{saveLabel}}</button>
  </footer>
</section>
