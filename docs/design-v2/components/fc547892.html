<!-- Diálogo · Episodio -->
<!-- CSS:
body{margin:0}
-->
<section class="w-full flex flex-col bg-panel border border-edge rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.55)] text-fg font-sans" role="dialog" aria-modal="true" aria-labelledby="dlg-ep-title">
  <header class="flex items-center gap-3 py-4 pr-4 pl-6 border-b border-line">
    <div class="flex-1 flex flex-col gap-0.5">
      <span class="font-mono text-[11px] tracking-[0.12em] text-muted">DRAGON BALL Z · EPISODIO</span>
      <h2 class="m-0 font-display text-[22px] font-semibold" id="dlg-ep-title">{{heading}}</h2>
    </div>
    <button class="btn-icon" type="button" aria-label="Cerrar" (click)="close($event)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <div class="flex flex-col gap-3.5 py-5 px-6">
    <label class="flex flex-col gap-1.5 text-[12px] text-muted">Título
      <input class="field" type="text" [attr.value]="title">
    </label>
    <div class="grid grid-cols-[repeat(3,_minmax(0,_1fr))] gap-2.5">
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Temporada
        <select class="field field-select"><option>T0 · Especiales</option><option>T1</option><option selected="">T2</option><option>T3</option><option>T4</option></select>
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Tipo
        <select class="field field-select"><option selected="">Episodio</option><option>Opening</option><option>Ending</option><option>Relleno</option><option>Especial</option><option>Película</option></select>
      </label>
      <label class="flex flex-col gap-1.5 text-[12px] text-muted">Número
        <input class="field field-mono" type="number" min="0" value="14">
      </label>
    </div>
    <span class="text-[12px] text-muted">Temporada + tipo + número deben ser únicos dentro de la serie.</span>

    <div class="flex flex-col gap-1.5">
      <span class="text-[12px] text-muted">Archivo de video</span>
      <div class="flex items-center gap-2.5 py-2.5 px-3 border border-edge rounded-md bg-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>
        <span class="flex-1 min-w-0 font-mono text-[12px] truncate">/media/series/dbz/T02/dbz_t2_e14.mp4</span>
        <label class="relative inline-flex items-center min-h-9 py-0 px-3 border border-edge rounded-md text-[13px] cursor-pointer">Reemplazar
          <input class="absolute w-[1px] h-[1px] opacity-[0]" type="file" accept="video/*">
        </label>
      </div>
      <span class="font-mono text-[11px] text-dim">21:40 · 720p · h264 · 2 puntos de corte</span>
    </div>

    <label class="flex items-center justify-between gap-3 min-h-13 py-0 px-3 border border-line rounded-md">
      <span class="flex flex-col gap-0.5">
        <span class="text-[14px]">Disponible para emisión</span>
        <span class="text-[12px] text-muted">Si se desactiva, la programación lo omite</span>
      </span>
      <input class="check" type="checkbox" checked="">
    </label>
  </div>

  <footer class="flex flex-wrap items-center gap-2.5 py-4 px-6 border-t border-line">
    <button class="btn btn-danger-text" type="button" (click)="close($event)">Eliminar episodio</button>
    <span class="flex-1"></span>
    <button class="btn btn-ghost" type="button" (click)="close($event)">Cancelar</button>
    <button class="btn btn-primary" type="button" (click)="close($event)">Guardar</button>
  </footer>
</section>
